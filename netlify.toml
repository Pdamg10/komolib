[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: todas las rutas (incluidos enlaces ?join=KOMO-XXXX y ?shelf=SHELF-XXXX)
# deben servir index.html para que React Router / la app resuelva la vista.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
