<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Original KomoLib warm stationery cream/sand background -->
    <linearGradient id="komoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EAE0"/>
      <stop offset="55%" stop-color="#E5D8CA"/>
      <stop offset="100%" stop-color="#D2C2B4"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F8F2EA"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F3EAE0"/>
    </linearGradient>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#3B3532" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="240" height="240" rx="54" fill="url(#komoBg)"/>
  <rect x="4" y="4" width="232" height="232" rx="50" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Paper plane flying from the book in KomoLib coral accent -->
  <path d="M174,30 L212,44 L185,54 L190,75 L176,55 Z" fill="#E86F68"/>
  <path d="M174,30 L190,75 L183,60 Z" fill="#C7534D"/>

  <!-- Open book with warm shadow -->
  <g filter="url(#bookShadow)">
    <!-- Subtle book cover edge underneath -->
    <path d="M120,159 C91,151 66,155 44,167 L44,159 C66,148 91,144 120,152 C149,144 174,148 196,159 L196,167 C174,155 149,151 120,159 Z"
          fill="#C87B75" opacity="0.65"/>

    <!-- Left page -->
    <path d="M120,74 C92,66 68,70 46,82 L46,162 C68,151 92,147 120,155 Z"
          fill="url(#pageLeft)" stroke="#D4C4B6" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M120,74 C148,66 172,70 194,82 L194,162 C172,151 148,147 120,155 Z"
          fill="url(#pageRight)" stroke="#D4C4B6" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- Spine crease -->
  <line x1="120" y1="74" x2="120" y2="155" stroke="#8C8279" stroke-width="2.2" opacity="0.35"/>

  <!-- Left page subtle text lines -->
  <line x1="58" y1="103" x2="87" y2="100" stroke="#8C8279" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <line x1="58" y1="115" x2="85" y2="112" stroke="#8C8279" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <line x1="58" y1="127" x2="83" y2="124" stroke="#8C8279" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Right page subtle text lines -->
  <line x1="153" y1="100" x2="182" y2="103" stroke="#8C8279" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <line x1="155" y1="112" x2="182" y2="115" stroke="#8C8279" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <line x1="157" y1="124" x2="182" y2="127" stroke="#8C8279" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Genre tabs along right edge -->
  <rect x="192" y="88" width="16" height="9.5" rx="3.8" fill="#F0A868"/>
  <rect x="192" y="107" width="16" height="9.5" rx="3.8" fill="#5FC9BF"/>
  <rect x="192" y="126" width="16" height="9.5" rx="3.8" fill="#E86F68"/>

  <!-- Central Komolib "K" emblem cleanly centered on the open book -->
  <circle cx="120" cy="114" r="28" fill="#FDFBF8" stroke="#DFD1C3" stroke-width="2"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper & lower diagonal arms in KomoLib coral -->
    <path d="M132,98 L111,114 L132,130" stroke="#E86F68" stroke-width="6.8"/>
    <!-- Crisp vertical stem on top in KomoLib espresso ink -->
    <path d="M109,98 L109,130" stroke="#3B3532" stroke-width="6.8"/>
  </g>
</svg>
