name: Build Web & Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build Web
        env:
          VITE_SYNC_SERVER_URL: ${{ vars.VITE_SYNC_SERVER_URL || secrets.VITE_SYNC_SERVER_URL }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL || secrets.VITE_PUBLIC_APP_URL }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomoLib-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
